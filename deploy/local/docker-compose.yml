services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ${RS_QDRANT_STORAGE_PATH:-../../data/qdrant/storage}:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${RS_POSTGRES_DB:-rs_agent}
      POSTGRES_USER: ${RS_POSTGRES_USER:-rs_agent}
      POSTGRES_PASSWORD: ${RS_POSTGRES_PASSWORD:-replace-with-local-postgres-password}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=10"
      - "-c"
      - "max_parallel_workers=2"
      - "-c"
      - "max_parallel_maintenance_workers=1"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../../data/postgres/pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: "512mb"
    restart: unless-stopped

  scylla:
    image: scylladb/scylla:6.2
    profiles: ["cassandra"]
    command:
      - "--smp=1"
      - "--memory=1G"
      - "--overprovisioned=1"
      - "--api-address=0.0.0.0"
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - ../../data/scylla:/var/lib/scylla
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${RS_MINIO_ACCESS_KEY:-replace-with-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${RS_MINIO_SECRET_KEY:-replace-with-local-minio-secret-key}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  serving:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.serving
    profiles: ["serving"]
    env_file:
      - .env
    environment:
      RS_SERVING_CONFIG: /app/configs/serving/online_service.local_qdrant.yaml
      RS_QDRANT_URL: http://qdrant:6333
      RS_CANDIDATE_STORE_BACKEND: ${RS_CANDIDATE_STORE_BACKEND:-noop}
      RS_CASSANDRA_HOSTS: ${RS_CASSANDRA_HOSTS:-scylla}
      RS_CASSANDRA_PORT: ${RS_CASSANDRA_PORT:-9042}
      RS_CASSANDRA_KEYSPACE: ${RS_CASSANDRA_KEYSPACE:-rs_agent}
      RS_CASSANDRA_DATACENTER: ${RS_CASSANDRA_DATACENTER:-datacenter1}
      RS_CASSANDRA_STORE_VERSION: ${RS_CASSANDRA_STORE_VERSION:-pool500_vnext_hot010_stable_20260522}
      RS_AGENT_INFERENCE_POLICY: off
      RS_ENABLE_SIMULATION_ENDPOINTS: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  minio_data:
