services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    profiles: ["frontend"]
    environment:
      VITE_RS_AGENT_API_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  online_service:
    build:
      context: ..
      dockerfile: deploy/docker/online_service.Dockerfile
    profiles: ["online"]
    environment:
      RS_AGENT_INFERENCE_POLICY: off
      RS_ENABLE_SIMULATION_ENDPOINTS: "0"
      RS_MILVUS_URI: ${RS_MILVUS_DOCKER_URI:-http://milvus-standalone:19530}
      RS_ELASTICSEARCH_URI: ${RS_ELASTICSEARCH_DOCKER_URI:-http://elasticsearch:9200}
      RS_ELASTICSEARCH_INDEX: ${RS_ELASTICSEARCH_INDEX:-rs_agent_rag_bm25_v1}
      RS_ELASTICSEARCH_TIMEOUT: ${RS_ELASTICSEARCH_TIMEOUT:-10}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  agent_service:
    build:
      context: ..
      dockerfile: deploy/docker/agent_service.Dockerfile
    profiles: ["agent"]
    environment:
      RS_AGENT_INFERENCE_POLICY: off
      RS_ENABLE_SIMULATION_ENDPOINTS: "0"
      RS_MILVUS_URI: ${RS_MILVUS_DOCKER_URI:-http://milvus-standalone:19530}
      RS_ELASTICSEARCH_URI: ${RS_ELASTICSEARCH_DOCKER_URI:-http://elasticsearch:9200}
      RS_ELASTICSEARCH_INDEX: ${RS_ELASTICSEARCH_INDEX:-rs_agent_rag_bm25_v1}
      RS_ELASTICSEARCH_TIMEOUT: ${RS_ELASTICSEARCH_TIMEOUT:-10}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  data_worker:
    build:
      context: ..
      dockerfile: deploy/docker/data_worker.Dockerfile
    profiles: ["worker"]
    command: ["python", "-m", "rs_core.data.runtime.worker", "health"]

  offline_worker:
    build:
      context: ..
      dockerfile: deploy/docker/offline_worker.Dockerfile
    profiles: ["worker"]
    command: ["python", "-m", "rs_core.offline.runtime.worker", "health"]

  mysql:
    image: mysql:8.0
    profiles: ["infra"]
    command:
      - "--innodb-use-native-aio=0"
      - "--innodb-redo-log-capacity=1073741824"
    environment:
      MYSQL_DATABASE: ${RS_MYSQL_DB:-rs_agent}
      MYSQL_USER: ${RS_MYSQL_USER:-rs_agent}
      MYSQL_PASSWORD: ${RS_MYSQL_PASSWORD:-replace-with-local-mysql-password}
      MYSQL_ROOT_PASSWORD: ${RS_MYSQL_ROOT_PASSWORD:-replace-with-local-mysql-root-password}
    ports:
      - "127.0.0.1:${RS_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ../db/mysql:/var/lib/mysql
      - ./local/mysql/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../data/redis:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["infra"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rs_agent
      MINIO_ROOT_PASSWORD: rs_agent_dev_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ../data/minio:/data

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: ["infra", "online", "agent"]
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ../db/milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["infra", "online", "agent"]
    environment:
      MINIO_ROOT_USER: ${RS_MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RS_MILVUS_MINIO_SECRET_KEY:-minioadmin}
      MINIO_ACCESS_KEY: ${RS_MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${RS_MILVUS_MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ../db/milvus/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.6.18
    profiles: ["infra", "online", "agent"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ROOT_USER: ${RS_MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RS_MILVUS_MINIO_SECRET_KEY:-minioadmin}
      MINIO_ACCESS_KEY: ${RS_MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${RS_MILVUS_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ../db/milvus/standalone:/var/lib/milvus
    ports:
      - "127.0.0.1:${RS_MILVUS_HOST_PORT:-19530}:19530"
      - "127.0.0.1:${RS_MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    profiles: ["infra", "online", "agent"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${RS_ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - ../db/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["gateway"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - online_service
      - agent_service
    restart: unless-stopped
