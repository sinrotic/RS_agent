baseline_config_path: configs/phase_1_15_frozen_youtubednn_pool100.yaml
phase: phase_1_21_recall_coverage_graph
limit_users: 500
evaluation_mode: valid_test
hit_rate_denominator: users_with_holdout
expected_users_with_holdout: 138
output_root: outputs/phase_1_21_recall_coverage
candidate_pool_size: 200
no_leakage_note: holdout targets and miss_targets.csv are diagnostics/evaluation only, never candidate generation or parameter selection.
item_graph_enabled: true
item_graph_seed_window: 20
item_graph_per_seed: 20
item_graph_per_user: 30
graph_walk_seed_enabled: false
graph_method_note: item_graph uses train-visible co-occurrence graph view from user_sequences.train.jsonl; graph_walk_seed requires a validated Phase 1.19 sidecar and remains disabled here.
