baseline_config_path: configs/phase_1_15_frozen_youtubednn_pool100.yaml
phase: phase_1_21_recall_coverage_pool200_experimental
limit_users: 500
evaluation_mode: valid_test
hit_rate_denominator: users_with_holdout
expected_users_with_holdout: 138
output_root: outputs/phase_1_21_recall_coverage
candidate_pool_size: 200
no_leakage_note: holdout targets and miss_targets.csv are diagnostics/evaluation only, never candidate generation or parameter selection.
co_visit_fallback_repair_enabled: true
co_visit_seed_window: 20
co_visit_per_seed: 20
co_visit_per_user: 30
co_visit_min_score: 1.0
co_visit_max_item_user_freq: 50
co_visit_recency_decay: 0.9
usercf_enabled: true
usercf_seed_window: 20
usercf_similar_users: 30
usercf_per_user: 30
usercf_min_score: 0.0
swing_enabled: true
swing_seed_window: 20
swing_per_seed: 20
swing_per_user: 30
swing_alpha: 1.0
swing_min_score: 0.0
candidate_pool_strategy: balanced_source_budget
candidate_source_minimums:
  semantic_title_category_expansion: 40
  co_visit_fallback_repair: 20
  usercf_recall: 10
  swing_recall: 10
candidate_source_maximums:
  popular: 40
candidate_fill_order: ["semantic_title_category_expansion", "co_visit_fallback_repair", "usercf_recall", "swing_recall", "itemcf", "category", "popular"]
candidate_multi_source_boost: 0.1
semantic_title_category_expansion:
  enabled: true
  per_user: 20
  per_seed: 10
  seed_window: 20
  min_title_overlap: 1
  category_weight: 2.0
  weak_category_boost: 0.5
  weak_categories: ["All Electronics", "Office Products", "Computers"]
  text_fields: ["title_clean", "main_category", "categories_flat"]
  require_category_overlap: true
  rank_weight: 1.0
