baseline_config_path: configs/phase_1_15_frozen_youtubednn_pool100.yaml
phase: phase_1_21_recall_coverage
limit_users: 500
evaluation_mode: valid_test
hit_rate_denominator: users_with_holdout
expected_users_with_holdout: 138
output_root: outputs/phase_1_21_recall_coverage
no_leakage_note: holdout targets and miss_targets.csv are diagnostics/evaluation only, never candidate generation or parameter selection.
semantic_title_category_expansion:
  enabled: true
  per_user: 20
  per_seed: 10
  seed_window: 20
  min_title_overlap: 1
  category_weight: 2.0
  weak_category_boost: 0.5
  weak_categories: ["All Electronics", "Office Products", "Computers"]
  text_fields: ["title_clean", "main_category", "categories_flat"]
  require_category_overlap: true
  rank_weight: 1.0
