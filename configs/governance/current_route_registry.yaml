schema_version: current_route_registry_v1
routes:
  current_recall_route:
    role: recall
    status: deprecated
    authority_refs: ["dic/decisions/POOL200_RETIREMENT_RECORD_2026_06_08.md", "dic/ENGINEERING_NARRATIVE_LOG.md", "dic/experiments/recall/RECALL_METHODS_EXPERIMENT_LOG.md"]
    config_paths: []
    workflow_paths: []
    script_paths: []
    required_output_paths: []
    promotion_gate_ref: dic/guides/CODEBASE_GOVERNANCE_GUIDE.md#recall-route-promotion
    notes: Pool200 source-balanced recall route retired on 2026-06-08; only historical records remain.
  current_ranking_route:
    role: ranking
    status: current_engineering_main
    authority_refs: ["dic/decisions/COLD_DEEPFM_MAIN_RANKING_ROUTE_ADR_2026_06_20.md", "dic/ENGINEERING_NARRATIVE_LOG.md"]
    config_paths: []
    workflow_paths: ["rs_core/recsys/cold_deepfm.py", "rs_core/workflow/online_recommendation.py"]
    script_paths: ["rs_lab/experiments/ranking/run_cold_deepfm_offline_train_eval.py"]
    required_output_paths: ["outputs/ranking/cold_full_formal_20260620_existing_deepfm/cold_model.json", "outputs/ranking/cold_full_formal_20260620_existing_deepfm/deepfm_model.json", "outputs/ranking/cold_full_formal_20260620_existing_deepfm/manifest.json", "outputs/ranking/cold_full_formal_20260620_existing_deepfm/comparison.json"]
    promotion_gate_ref: dic/decisions/COLD_DEEPFM_MAIN_RANKING_ROUTE_ADR_2026_06_20.md
    ranking_strategy: pool500_cold_coarse_then_deepfm_fine
    fallback_route: baseline_cached_popular
    effect_claim_allowed: false
    notes: COLD coarse rank plus DeepFM fine rank is fixed as the current engineering main ranking route for Agent/frontend closure. This is an engineering-route promotion with baseline fallback; do not claim strict overall ranking lift while candidate coverage gate remains STOP_FOR_RANKING_EFFECT.
  current_agent_demo_route:
    role: agent_demo
    status: provisional_current
    authority_refs: ["dic/README.md", "dic/PROJECT_STRUCTURE.md"]
    config_paths: ["configs/demo/hybrid_demo/hybrid_demo_electronics_10000_lopo_semantic_title.yaml"]
    workflow_paths: ["rs_core/serving/application/recommendation_service.py", "rs_core/rsagent/runtime.py"]
    script_paths: ["scripts/serving/run_service.py", "scripts/evaluation/run_simulation_evaluation.py"]
    required_output_paths: []
    promotion_gate_ref: dic/guides/CODEBASE_GOVERNANCE_GUIDE.md#agent-demo-route-promotion
    notes: Provisional local Agent demo route; runtime should not embed governance details directly.
  current_online_service_route:
    role: online_serving
    status: provisional_current
    authority_refs: ["dic/README.md", "dic/architecture/ARCHITECTURE.md", "dic/guides/CODEBASE_GOVERNANCE_GUIDE.md"]
    config_paths: ["configs/serving/online_service.yaml"]
    workflow_paths: ["rs_core/serving/application/recommendation_service.py", "rs_core/workflow/online_recommendation.py", "rs_core/workflow/hybrid_environment.py"]
    script_paths: ["scripts/serving/run_service.py"]
    required_output_paths: ["outputs/recall/pool500_vnext_hot010_stable_20260522/pool500_candidates.jsonl"]
    promotion_gate_ref: dic/guides/CODEBASE_GOVERNANCE_GUIDE.md#agent-demo-route-promotion
    candidate_generation_allowed: true
    ranking_input_replacement_allowed: false
    pool1000_allowed: false
    promotion_allowed: false
    full_pool500_ready_semantics: recall_artifact_readiness_only
    notes: Provisional online serving route lets service and Agent tools read prepared pool500 candidates, but does not authorize ranking-route replacement or promotion.
  pool500_recall_continuation_route:
    role: recall
    status: continuation_only
    authority_refs: ["dic/decisions/POOL200_RETIREMENT_RECORD_2026_06_08.md", "dic/ENGINEERING_NARRATIVE_LOG.md", "dic/guides/CODEBASE_GOVERNANCE_GUIDE.md"]
    config_paths: []
    workflow_paths: ["rs_core/workflow/pool500_route_gate.py", "rs_core/workflow/full_data_pool500_route_gate.py#full_data_pool500_artifact_gate"]
    script_paths: ["rs_lab/experiments/recall/run_p7_full_pool500_route_gate.py", "rs_lab/experiments/recall/run_full_data_pool500_batch01_dry_run.py"]
    required_output_paths: ["outputs/recall/p7_full_pool500_main_route_continuation/route_precheck_gate/manifest.json"]
    promotion_gate_ref: dic/guides/CODEBASE_GOVERNANCE_GUIDE.md#recall-route-promotion
    artifact_gate_schema_version: full_data_pool500_artifact_gate_v5
    artifact_gate_workflow: "rs_core/workflow/full_data_pool500_route_gate.py#full_data_pool500_artifact_gate"
    allowed_decisions: ["FULL_POOL500_READY", "DIAGNOSTIC_ONLY_PARTIAL", "STOP"]
    candidate_generation_allowed: false
    ranking_input_replacement_allowed: false
    shadow_mode: read_only_shadow_evidence
    full_pool500_ready_semantics: recall_artifact_readiness_only
    public_display_forbidden_fields: ["agent_runtime_trace", "diagnostics_path", "ranking_evidence_path", "raw_export_trace_path", "trace_ref"]
    notes: Recall-only continuation candidate. FULL_POOL500_READY only means recall artifact ready; it does not authorize ranking input replacement. Pool200 input artifacts were retired on 2026-06-08 and must be retargeted before rerunning the P7 bridge gate.
