[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-agent"
version = "0.1.0"
description = "Conversational recommendation system agent prototype"
readme = "dic/README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
qdrant = [
    "qdrant-client",
]
qdrant-rag = [
    "qdrant-client",
    "sentence-transformers",
]

[tool.setuptools.packages.find]
include = ["rs_core*"]

[tool.pytest.ini_options]
markers = [
    "unit: fast unit tests for pure functions and small modules",
    "smoke: small end-to-end checks for core flows",
    "slow: long-running offline evaluations or batch jobs",
    "gpu: tests requiring GPU resources",
    "experiment: experiment validation not included in the default gate",
    "serving: service API and session flow tests",
    "frontend: frontend build, type-check, or integration checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["rs_core", "scripts", "tests"]

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
