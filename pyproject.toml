[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-agent"
version = "0.1.0"
description = "Conversational recommendation system agent prototype"
readme = "dic/README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
serving = [
    "fastapi",
    "uvicorn",
    "httpx",
]
milvus = [
    "pymilvus",
    "milvus-lite",
]
milvus-rag = [
    "pymilvus",
    "milvus-lite",
    "sentence-transformers",
]
artifacts = [
    "minio",
]
elasticsearch = [
    "elasticsearch>=8,<9",
]
cassandra = [
    "cassandra-driver",
]
training = [
    "torch",
    "scikit-learn",
    "sentence-transformers",
    "xgboost",
    "lightgbm",
    "implicit",
    "lightfm",
    "transformers>=4.57.0",
    "accelerate",
    "safetensors",
    "datasets",
    "peft",
    "trl",
    "bitsandbytes",
]

[tool.setuptools.packages.find]
include = ["rs_core*", "services*"]

[tool.pytest.ini_options]
markers = [
    "unit: fast unit tests for pure functions and small modules",
    "smoke: small end-to-end checks for core flows",
    "slow: long-running offline evaluations or batch jobs",
    "gpu: tests requiring GPU resources",
    "experiment: experiment validation not included in the default gate",
    "serving: service API and session flow tests",
    "frontend: frontend build, type-check, or integration checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["rs_core", "services", "scripts", "tests"]

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
