x-common-env: &common-env
  JAVA_OPTS: ${RS_JAVA_OPTS:--Xms128m -Xmx512m}
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_DISCOVERY_IP_TYPE: IPv4
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${RS_REDIS_PASSWORD:-rs_agent_redis_password}
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: 6379
  SPRING_REDIS_PASSWORD: ${RS_REDIS_PASSWORD:-rs_agent_redis_password}
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${RS_MYSQL_DATABASE:-rs_agent}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
  SPRING_DATASOURCE_USERNAME: ${RS_MYSQL_USER:-rs_agent}
  SPRING_DATASOURCE_PASSWORD: ${RS_MYSQL_PASSWORD:-rs_agent_dev_password}
  RS_ELASTICSEARCH_URI: http://elasticsearch:9200
  RS_MINIO_ENDPOINT: http://minio:9000
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "*"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_LIVENESS_INCLUDE: livenessState

x-java-service: &java-service
  image: eclipse-temurin:21-jre
  restart: unless-stopped
  working_dir: /app
  networks:
    - rs-agent-java
  volumes:
    - ../services:/app:ro
    - ../logs:/logs
  depends_on:
    mysql-migrate:
      condition: service_completed_successfully
    scylla-migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT}; printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
    interval: 10s
    start_period: 30s
    timeout: 5s
    retries: 12

services:
  mysql-migrate:
    image: mysql:8.0
    restart: "no"
    networks:
      - rs-agent-java
    environment:
      MYSQL_PWD: ${RS_MYSQL_PASSWORD:-rs_agent_dev_password}
      MYSQL_DATABASE: ${RS_MYSQL_DATABASE:-rs_agent}
      MYSQL_USER: ${RS_MYSQL_USER:-rs_agent}
    volumes:
      - ${RS_SCHEMA_DIR:-../../../sql}:/schema:ro
    command:
      - bash
      - -ec
      - |
        for attempt in {1..60}; do
          mysqladmin ping -h mysql -u"$$MYSQL_USER" --silent && break
          sleep 2
        done
        mysqladmin ping -h mysql -u"$$MYSQL_USER" --silent
        for schema in \
          rs_service_user_schema.sql \
          rs_service_catalog_schema.sql \
          rs_service_trade_schema.sql \
          rs_service_commerce_v1_schema.sql \
          rs_service_recommend_schema.sql \
          rs_home_recommendation_indexes.sql \
          rs_service_agent_mysql_projection_schema.sql \
          rs_agent_session_projection_upgrade.sql; do
          mysql -h mysql -u"$$MYSQL_USER" "$$MYSQL_DATABASE" < "/schema/$$schema"
        done
        mysql -h mysql -u"$$MYSQL_USER" "$$MYSQL_DATABASE" \
          -e "SELECT component, version, applied_at FROM rs_schema_version ORDER BY component"

  scylla-migrate:
    image: scylladb/scylla:6.2
    restart: "no"
    networks:
      - rs-agent-java
    volumes:
      - ${RS_SCHEMA_DIR:-../../../sql}:/schema:ro
    command:
      - bash
      - -ec
      - |
        for attempt in {1..60}; do
          cqlsh scylla 9042 -e "SELECT release_version FROM system.local" && break
          sleep 2
        done
        cqlsh scylla 9042 -f /schema/rs_service_agent_scylla_session_schema.cql

  rs-service-model:
    <<: *java-service
    container_name: rs-agent-java-service-model
    environment:
      <<: *common-env
      SPRING_APPLICATION_NAME: rs-service-model
      SERVER_PORT: 18105
      RS_MODEL_RUNTIME_EMBEDDING_BASE_URL: ${RS_MODEL_RUNTIME_EMBEDDING_BASE_URL:-}
      RS_MODEL_RUNTIME_RERANK_BASE_URL: ${RS_MODEL_RUNTIME_RERANK_BASE_URL:-}
    command: ["sh", "-c", "java $$JAVA_OPTS -jar /app/rs-service-model.jar"]
    ports:
      - "127.0.0.1:${RS_MODEL_HOST_PORT:-18105}:18105"

