      - "127.0.0.1:${RS_SECKILL_HOST_PORT:-18094}:8094"

  rs-api-gateway:
    <<: *java-service
    container_name: rs-agent-java-api-gateway
    environment:
      <<: *common-env
      SPRING_APPLICATION_NAME: rs-api-gateway
      SERVER_PORT: 18088
      SPRING_PROFILES_ACTIVE: ${RS_DEPLOYMENT_PROFILE:-recommend}
      RS_GATEWAY_AUTH_TOKEN_VALIDATION: redis
      RS_GATEWAY_TRUSTED_PROXIES: ${RS_GATEWAY_TRUSTED_PROXIES:-rs-frontend}
    command: ["sh", "-c", "java $$JAVA_OPTS -jar /app/rs-api-gateway.jar"]
    ports:
      - "127.0.0.1:${RS_GATEWAY_HOST_PORT:-18088}:18088"

networks:
  rs-agent-java:
    external: true
    name: rs-agent-java_default
