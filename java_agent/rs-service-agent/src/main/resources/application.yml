server:
  port: 18104

spring:
  mvc:
    async:
      # 完整模型回答可能超过容器默认 30 秒；保留有界超时与用户主动中断。
      request-timeout: ${RS_AGENT_STREAM_REQUEST_TIMEOUT:120s}
  application:
    name: rs-service-agent
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848}
  ai:
    model:
      chat: openai
    chat:
      client:
        # AgentLoop owns tool execution; keep Spring AI from consuming tool calls internally.
        tool-calling:
          enabled: false
    openai:
      base-url: ${RS_AGENT_OPENAI_BASE_URL:https://cpa2api.sinrotic233.com/v1}
      api-key: ${RS_AGENT_API_KEY:${RS_agent:}}
      chat:
        # SDK 隐藏重试不能绕过逐次预留；预算开启时启动校验要求为 0。
        max-retries: 0
        options:
          model: ${RS_AGENT_OPENAI_MODEL:gpt-5.3-codex-spark}
          temperature: ${RS_AGENT_OPENAI_TEMPERATURE:0.55}
          max-tokens: ${RS_AGENT_OPENAI_MAX_TOKENS:1200}
          tool-choice: required
          parallel-tool-calls: true

rs:
  recommend:
    base-url: ${RS_RECOMMEND_BASE_URL:http://rs-service-recommend:18103}
  agent:
    online-evaluation:
      enabled: ${RS_AGENT_ONLINE_EVALUATION_ENABLED:false}
      base-url: ${RS_EVAL_INGEST_BASE_URL:}
      token: ${RS_EVAL_INGEST_TOKEN:}
      outbox: ${RS_EVAL_JAVA_OUTBOX:}
      skill-version: ${RS_EVAL_BASELINE_SKILL_VERSION:unknown}
      model-version: ${RS_EVAL_RECOMMENDATION_MODEL_VERSION:unknown}
    performance-observation-enabled: ${RS_AGENT_PERFORMANCE_OBSERVATION_ENABLED:false}
    direct-recommendation:
      enabled: ${RS_AGENT_DIRECT_RECOMMENDATION_ENABLED:false}
      llm-synthesis-enabled: ${RS_AGENT_LLM_SYNTHESIS_ENABLED:false}
      # 仅填写经目录数据来源核验的币种；为空时预算请求继续 Agent。
      catalog-currency: ${RS_AGENT_CATALOG_CURRENCY:}
    templates:
      default-profile: shopping-assistant
    delegate:
      rag-agent:
        base-url: ${RS_RECOMMEND_SERVICE_URL:http://rs-service-recommend:18103}
    recommendation:
      # memory 适合本地开发；部署时切换为 http 接入 rs-service-recommend。
      type: ${RS_AGENT_RECOMMENDATION_TYPE:memory}
      base-url: ${RS_RECOMMEND_SERVICE_URL:http://rs-service-recommend:18103}
      candidates-path: ${RS_RECOMMEND_CANDIDATES_PATH:/agent/recommend/candidates}
      semantic-recall-path: ${RS_RECOMMEND_SEMANTIC_RECALL_PATH:/agent/recommend/semantic-recall}
    session-store:
      # memory 适合本地开发；部署时切换为 redis 保存热会话和快照。
      type: ${RS_AGENT_SESSION_STORE_TYPE:memory}
      key-prefix: ${RS_AGENT_SESSION_STORE_KEY_PREFIX:agent:session:}
      ttl: ${RS_AGENT_SESSION_STORE_TTL:15m}
    model-provider:
      final-answer-max-tokens: ${RS_AGENT_FINAL_ANSWER_MAX_TOKENS:0}
      compact-tool-schemas-enabled: ${RS_AGENT_COMPACT_TOOL_SCHEMAS_ENABLED:false}
      type: spring_ai
      constrained-decoding-enabled: ${RS_AGENT_CONSTRAINED_DECODING_ENABLED:false}
    session-lifecycle:
      enabled: ${RS_AGENT_SESSION_LIFECYCLE_ENABLED:${RS_AGENT_SESSION_PERSISTENCE_ENABLED:false}}
      user-base-url: ${RS_USER_SERVICE_URL:http://rs-service-user:18101}
    session-persistence:
      enabled: ${RS_AGENT_SESSION_PERSISTENCE_ENABLED:false}
      schema-version: ${RS_AGENT_SESSION_SCHEMA_VERSION:agent_session_v1}
      scylla:
        host: ${RS_SCYLLA_HOST:127.0.0.1}
        port: ${RS_SCYLLA_PORT:19042}
        local-datacenter: ${RS_SCYLLA_LOCAL_DATACENTER:datacenter1}
        keyspace: ${RS_SCYLLA_KEYSPACE:rs_agent}
      mysql:
        jdbc-url: ${RS_MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:13306/rs_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
        username: ${RS_MYSQL_USER:rs_agent}
        password: ${RS_MYSQL_PASSWORD:rs_agent_dev_password}
        maximum-pool-size: ${RS_AGENT_MYSQL_MAXIMUM_POOL_SIZE:8}
        minimum-idle: ${RS_AGENT_MYSQL_MINIMUM_IDLE:2}
        connection-timeout-ms: ${RS_AGENT_MYSQL_CONNECTION_TIMEOUT_MS:3000}
    reasoning:
      budget-enabled: ${RS_AGENT_MODEL_BUDGET_ENABLED:true}
      max-tokens: ${RS_AGENT_TURN_MAX_TOKENS:131072}
      max-model-calls: ${RS_AGENT_TURN_MAX_MODEL_CALLS:32}
      max-output-tokens: ${RS_AGENT_CALL_MAX_OUTPUT_TOKENS:4096}
      input-padding-tokens: ${RS_AGENT_INPUT_PADDING_TOKENS:512}
      # 费用为显式配置费率的估算；0 关闭费用上限，不表示实际免费。
      max-usd: ${RS_AGENT_TURN_MAX_USD:0}
      pricing-configured: ${RS_AGENT_PRICING_CONFIGURED:false}
      priced-model: ${RS_AGENT_PRICED_MODEL:}
      input-usd-per-million: ${RS_AGENT_INPUT_USD_PER_MILLION:0}
      output-usd-per-million: ${RS_AGENT_OUTPUT_USD_PER_MILLION:0}
      drift-enabled: ${RS_AGENT_DRIFT_ENABLED:true}
      semantic-review-enabled: ${RS_AGENT_SEMANTIC_REVIEW_ENABLED:true}
      review-every: ${RS_AGENT_DRIFT_REVIEW_EVERY:3}
      max-drift-violations: ${RS_AGENT_MAX_DRIFT_VIOLATIONS:2}
      review-max-tokens: ${RS_AGENT_DRIFT_REVIEW_MAX_TOKENS:256}
      review-timeout-ms: ${RS_AGENT_DRIFT_REVIEW_TIMEOUT_MS:5000}
    tool-governance:
      enabled: ${RS_AGENT_TOOL_GOVERNANCE_ENABLED:true}
      max-attempts: ${RS_AGENT_TOOL_MAX_ATTEMPTS:2}
      max-attempts-per-turn: ${RS_AGENT_TOOL_MAX_ATTEMPTS_PER_TURN:32}
      call-timeout-ms: ${RS_AGENT_TOOL_EXECUTION_TIMEOUT_MS:30000}
      turn-timeout-ms: ${RS_AGENT_TURN_TIMEOUT_MS:120000}
      retry-delay-ms: ${RS_AGENT_TOOL_RETRY_DELAY_MS:50}
      no-progress-limit: ${RS_AGENT_TOOL_NO_PROGRESS_LIMIT:3}
      circuit-failure-threshold: ${RS_AGENT_TOOL_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-ms: ${RS_AGENT_TOOL_CIRCUIT_OPEN_MS:10000}
    trace:
      enabled: ${RS_AGENT_TRACE_ENABLED:false}
      queue-capacity: ${RS_AGENT_TRACE_QUEUE_CAPACITY:512}
      request-timeout-ms: ${RS_AGENT_TRACE_REQUEST_TIMEOUT_MS:2000}
      shutdown-timeout-ms: ${RS_AGENT_TRACE_SHUTDOWN_TIMEOUT_MS:3000}
      max-event-bytes: ${RS_AGENT_TRACE_MAX_EVENT_BYTES:65536}
      platform-trace-base-url: ${RS_PLATFORM_TRACE_SERVICE_URL:http://rs-service-platform-trace:18108}
      otlp:
        enabled: ${RS_AGENT_TRACE_OTLP_ENABLED:false}
        endpoint: ${RS_AGENT_TRACE_OTLP_ENDPOINT:}
        authorization: ${RS_AGENT_TRACE_OTLP_AUTHORIZATION:}
        identity-key: ${RS_AGENT_TRACE_OTLP_IDENTITY_KEY:}
        langfuse: ${RS_AGENT_TRACE_OTLP_LANGFUSE:false}
        service-name: ${RS_AGENT_TRACE_OTLP_SERVICE_NAME:rs-service-agent}
        model-name: ${RS_AGENT_TRACE_OTLP_MODEL_NAME:}
    execution:
      max-active-loops: ${RS_AGENT_MAX_ACTIVE_LOOPS:32}
      active-loop-acquire-timeout-ms: ${RS_AGENT_ACTIVE_LOOP_ACQUIRE_TIMEOUT_MS:300}
      max-model-streams: ${RS_AGENT_MAX_MODEL_STREAMS:8}
      model-stream-acquire-timeout-ms: ${RS_AGENT_MODEL_STREAM_ACQUIRE_TIMEOUT_MS:200}
      max-tool-calls: ${RS_AGENT_MAX_TOOL_CALLS:64}
      tool-acquire-timeout-ms: ${RS_AGENT_TOOL_ACQUIRE_TIMEOUT_MS:300}
      max-recommendation-calls: ${RS_AGENT_MAX_RECOMMENDATION_CALLS:8}
      recommendation-acquire-timeout-ms: ${RS_AGENT_RECOMMENDATION_ACQUIRE_TIMEOUT_MS:15000}
      max-session-queue-size: ${RS_AGENT_MAX_SESSION_QUEUE_SIZE:2}
      session-queue-timeout-ms: ${RS_AGENT_SESSION_QUEUE_TIMEOUT_MS:500}
