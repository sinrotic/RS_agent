mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

rs:
  catalog:
    cache:
      enabled: ${RS_CATALOG_CACHE_ENABLED:true}
      item-ttl-seconds: ${RS_CATALOG_CACHE_ITEM_TTL_SECONDS:86400}
      item-ttl-jitter-seconds: ${RS_CATALOG_CACHE_ITEM_TTL_JITTER_SECONDS:3600}
    local-cache:
      enabled: ${RS_CATALOG_LOCAL_CACHE_ENABLED:true}
      max-items: ${RS_CATALOG_LOCAL_CACHE_MAX_ITEMS:10000}
      item-ttl-seconds: ${RS_CATALOG_LOCAL_CACHE_ITEM_TTL_SECONDS:300}
      negative-ttl-seconds: ${RS_CATALOG_LOCAL_CACHE_NEGATIVE_TTL_SECONDS:30}
