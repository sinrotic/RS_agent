server:
  port: 8080

spring:
  application:
    name: rs-api-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            - id: rs-service-promotion
              uri: lb://rs-service-promotion
              predicates:
                - Path=/api/promotions/**
            - id: rs-service-checkout
              uri: lb://rs-service-order
              predicates:
                - Path=/api/checkout/**
            - id: rs-service-user-auth
              uri: lb://rs-service-user
              predicates:
                - Path=/api/auth/**
            - id: rs-service-user
              uri: lb://rs-service-user
              predicates:
                - Path=/api/users/**,/api/sessions/**
            - id: rs-service-catalog
              uri: lb://rs-service-catalog
              predicates:
                - Path=/api/catalog/**
            - id: rs-service-recommend
              uri: lb://rs-service-recommend
              predicates:
                - Path=/api/recommend/**
            - id: rs-service-agent
              uri: lb://rs-service-agent
              predicates:
                - Path=/api/agent/**
            - id: rs-service-recommend-platform-rag
              uri: lb://rs-service-recommend
              predicates:
                - Path=/api/platform/recommend/rag/**
            - id: rs-service-platform-trace
              uri: lb://rs-service-platform-trace
              predicates:
                - Path=/api/platform/**
            - id: rs-service-model
              uri: lb://rs-service-model
              predicates:
                - Path=/api/model/**
            - id: rs-service-inventory
              uri: lb://rs-service-inventory
              predicates:
                - Path=/api/inventory/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-Request-Id
                allow-credentials: true
                max-age: 3600

rs:
  gateway:
    auth:
      token-validation: ${RS_GATEWAY_AUTH_TOKEN_VALIDATION:redis}
    rate-limit:
      max-requests-per-minute: ${RS_GATEWAY_MAX_REQUESTS_PER_MINUTE:120}
      trusted-proxies: ${RS_GATEWAY_TRUSTED_PROXIES:}
