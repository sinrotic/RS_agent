server:
  port: 8080

spring:
  application:
    name: rs-api-gateway
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            - id: rs-service-user-auth
              uri: lb://rs-service-user
              predicates:
                - Path=/api/auth/**
            - id: rs-service-user
              uri: lb://rs-service-user
              predicates:
                - Path=/api/users/**,/api/sessions/**
            - id: rs-service-catalog
              uri: lb://rs-service-catalog
              predicates:
                - Path=/api/catalog/**
            - id: rs-service-recommend
              uri: lb://rs-service-recommend
              predicates:
                - Path=/api/recommend/**
            - id: rs-service-agent
              uri: lb://rs-service-agent
              predicates:
                - Path=/api/agent/**
            - id: rs-service-seckill
              uri: lb://rs-service-seckill
              predicates:
                - Path=/api/seckill/**,/api/platform/seckill/**
            - id: rs-service-recommend-platform-rag
              uri: lb://rs-service-recommend
              predicates:
                - Path=/api/platform/recommend/rag/**
            - id: rs-service-platform-trace
              uri: lb://rs-service-platform-trace
              predicates:
                - Path=/api/platform/**
            - id: rs-service-model
              uri: lb://rs-service-model
              predicates:
                - Path=/api/model/**
            - id: rs-service-order
              uri: lb://rs-service-order
              predicates:
                - Path=/api/orders/**
            # Payment provider callbacks are intentionally public; rs-service-payment validates signatures.
            - id: rs-service-payment
              uri: lb://rs-service-payment
              predicates:
                - Path=/api/payments/**,/callback/payments/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - X-Request-Id
                allow-credentials: true
                max-age: 3600

rs:
  gateway:
    auth:
      token-validation: presence
