spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: rs-service-promotion
              uri: lb://rs-service-promotion
              predicates:
                - Path=/api/promotions/**
            - id: rs-service-checkout
              uri: lb://rs-service-order
              predicates:
                - Path=/api/checkout/**
            - id: rs-service-user-auth
              uri: lb://rs-service-user
              predicates:
                - Path=/api/auth/**
            - id: rs-service-user
              uri: lb://rs-service-user
              predicates:
                - Path=/api/users/**,/api/sessions/**
            - id: rs-service-catalog
              uri: lb://rs-service-catalog
              predicates:
                - Path=/api/catalog/**
            - id: rs-service-recommend
              uri: lb://rs-service-recommend
              predicates:
                - Path=/api/recommend/**
            - id: rs-service-agent
              uri: lb://rs-service-agent
              predicates:
                - Path=/api/agent/**
            - id: rs-service-seckill
              uri: lb://rs-service-seckill
              predicates:
                - Path=/api/seckill/**,/api/platform/seckill/**
            - id: rs-service-recommend-platform-rag
              uri: lb://rs-service-recommend
              predicates:
                - Path=/api/platform/recommend/rag/**
            - id: rs-service-platform-trace
              uri: lb://rs-service-platform-trace
              predicates:
                - Path=/api/platform/**
            - id: rs-service-model
              uri: lb://rs-service-model
              predicates:
                - Path=/api/model/**
            - id: rs-service-order
              uri: lb://rs-service-order
              predicates:
                - Path=/api/orders/**
            # Provider callbacks remain public; rs-service-payment validates signatures.
            - id: rs-service-payment
              uri: lb://rs-service-payment
              predicates:
                - Path=/api/payments/**,/callback/payments/**
            - id: rs-service-inventory
              uri: lb://rs-service-inventory
              predicates:
                - Path=/api/inventory/**
